<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AyoMasak! – Masakan</title>
  <meta name="description" content="AyoMasak! – daftar masakan.">
  <script src="audio.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.documentElement.classList.add('embedded');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  
  <link rel="stylesheet" href="style.css">
</head>

<body class="page-recipes">
  <div class="game-loading-screen" id="gameLoadingScreen" role="status" aria-live="polite">
    <div class="game-loading-card">
      <span class="game-loading-spark game-loading-spark--left" aria-hidden="true">✦</span>
      <img class="game-loading-logo" src="assets/logo/ayomasak-logo.svg" alt="AyoMasak!" fetchpriority="high">
      <span class="game-loading-spark game-loading-spark--right" aria-hidden="true">✦</span>
      <p class="game-loading-title">Siap-siap memasak!</p>
      <p class="game-loading-message">Menyiapkan petualangan rasa...</p>
      <div class="game-loading-track" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <main>
    <section class="dialog" role="dialog" aria-label="Masakan">
      <div class="panel">

        <h1 class="panel__logo">
          <img class="panel__logo-image" src="assets/Buttons/button-recipe-index-logo.webp" alt="Masakan">
        </h1>

        <button class="close-button" type="button" aria-label="Tutup">
          <span class="close-button__base"></span>
          <span class="close-button__face">
            <span class="close-button__label close-button__label--shadow" aria-hidden="true">X</span>
            <span class="close-button__label" aria-hidden="true">X</span>
          </span>
        </button>

        <div class="index">
          <div class="index__list" id="dishGroups" aria-label="Daftar masakan menurut daerah"></div>
        </div>

      </div>
    </section>
    <section class="dish-story" id="dishStory" hidden
             role="dialog" aria-modal="true" aria-labelledby="dishStoryTitle">
      <div class="dish-story__paper">
        <button class="dish-story__close" id="dishStoryClose" type="button" aria-label="Tutup cerita masakan">×</button>
        <span class="dish-story__eyebrow" id="dishStoryCity"></span>
        <img class="dish-story__image" id="dishStoryImage" alt="" hidden>
        <span class="dish-story__emoji" id="dishStoryEmoji" aria-hidden="true"></span>
        <span class="dish-story__eyebrow">Cerita di balik hidangan</span>
        <h2 class="dish-story__title" id="dishStoryTitle"></h2>
        <p class="dish-story__text" id="dishStoryText"></p>
        <section class="dish-story__details" aria-label="Detail resep">
          <div class="dish-story__detail">
            <h3>Bahan utama</h3>
            <p id="dishStoryIngredients"></p>
          </div>
          <div class="dish-story__detail">
            <h3>Cara memasak</h3>
            <p id="dishStoryCooking"></p>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="recipe-catalog.js"></script>
  <script src="recipe-index-data.js"></script>
  <script>
    const embedded = new URLSearchParams(window.location.search).get('embed') === '1';
    const dishGroups = document.getElementById('dishGroups');
    const dishStory = document.getElementById('dishStory');
    const dishStoryClose = document.getElementById('dishStoryClose');
    let lastFocusedCard = null;

    function normalizeLabel(value) {
      return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    const indexRegions = window.AyoRecipeIndexData.map(indexRegion => {
      const catalogRegion = window.AyoDishCatalog.cities.find(region =>
        normalizeLabel(region.province) === normalizeLabel(indexRegion.province)
        && normalizeLabel(region.city) === normalizeLabel(indexRegion.city)
      );

      return {
        ...indexRegion,
        key: catalogRegion?.key || normalizeLabel(indexRegion.province),
        assetFolder: catalogRegion?.assetFolder,
        dishes: indexRegion.dishes.map((indexDish, dishIndex) => {
          const catalogDish = catalogRegion?.dishes.find(dish =>
            normalizeLabel(dish.dish).replace('klathak', 'klatak')
            === normalizeLabel(indexDish.dish).replace('klathak', 'klatak')
          );
          const id = catalogDish?.id || normalizeLabel(indexDish.dish).replace(/([a-z])([0-9])/g, '$1-$2');
          const regionalIllustration = `assets/recipe-index/${normalizeLabel(indexRegion.province)}/${String(dishIndex + 1).padStart(2, '0')}.webp`;
          const image = catalogDish?.image || (catalogRegion?.assetFolder && catalogDish
            ? `assets/Jawa/${catalogRegion.assetFolder}/${catalogDish.id}.webp`
            : regionalIllustration);

          return { ...indexDish, id, image, emoji: catalogDish?.emoji || '🍲' };
        })
      };
    });

    function openDishStory(region, dish) {
      const image = document.getElementById('dishStoryImage');
      const emoji = document.getElementById('dishStoryEmoji');
      const imagePath = dish.image;
      document.getElementById('dishStoryCity').textContent = region.city;
      document.getElementById('dishStoryTitle').textContent = dish.dish;
      document.getElementById('dishStoryText').textContent = dish.story;
      document.getElementById('dishStoryIngredients').textContent = dish.ingredients;
      document.getElementById('dishStoryCooking').textContent = dish.cooking;
      image.alt = dish.dish;
      emoji.textContent = dish.emoji;
      image.hidden = !imagePath;
      emoji.hidden = Boolean(imagePath);
      if (imagePath) {
        image.src = imagePath;
        image.addEventListener('error', () => {
          image.hidden = true;
          emoji.hidden = false;
        }, { once: true });
      } else {
        image.removeAttribute('src');
      }
      dishStory.hidden = false;
      requestAnimationFrame(() => {
        dishStory.classList.add('is-visible');
        dishStoryClose.focus();
      });
    }

    function closeDishStory() {
      if (dishStory.hidden) return;
      dishStory.classList.remove('is-visible');
      dishStory.hidden = true;
      lastFocusedCard?.focus();
    }

    indexRegions.forEach((region, regionIndex) => {
      const group = document.createElement('section');
      group.className = 'dish-group';
      const heading = document.createElement('h2');
      heading.className = 'dish-group__title';
      heading.id = `dish-region-${regionIndex}`;
      heading.textContent = `${region.island} — ${region.province}, ${region.city}`;
      const list = document.createElement('ul');
      list.className = 'dish-group__list';
      list.setAttribute('aria-labelledby', heading.id);

      region.dishes.forEach(dish => {
        const item = document.createElement('li');
        item.className = 'dish-card-item';
        const imagePath = dish.image;
        const card = document.createElement('button');
        card.className = 'dish-card';
        card.type = 'button';
        card.dataset.dish = dish.id;
        card.dataset.region = region.key;
        card.setAttribute('aria-label', `Lihat detail ${dish.dish}`);
        card.innerHTML = `
          <span class="dish-card__well"></span>
          <span class="dish-card__face">
            <span class="dish-card__icon">
              <img class="dish-card__photo" ${imagePath ? `src="${escapeHtml(imagePath)}"` : 'hidden'} alt="${escapeHtml(dish.dish)}">
              <span class="dish-card__emoji" ${imagePath ? 'hidden' : ''} aria-hidden="true">${escapeHtml(dish.emoji)}</span>
            </span>
          </span>
          <span class="dish-card__label dish-card__label--region dish-card__label--shadow" aria-hidden="true">${escapeHtml(region.city)}</span>
          <span class="dish-card__label dish-card__label--name dish-card__label--shadow" aria-hidden="true">${escapeHtml(dish.dish)}</span>
          <span class="dish-card__label dish-card__label--region">${escapeHtml(region.city)}</span>
          <span class="dish-card__label dish-card__label--name">${escapeHtml(dish.dish)}</span>`;
        const photo = card.querySelector('.dish-card__photo');
        const emoji = card.querySelector('.dish-card__emoji');
        photo.addEventListener('error', () => {
          photo.hidden = true;
          emoji.hidden = false;
        }, { once: true });
        item.appendChild(card);
        list.appendChild(item);
      });

      group.append(heading, list);
      dishGroups.appendChild(group);
    });

    document.querySelectorAll('.dish-card').forEach(card => {
      card.addEventListener('click', () => {
        const region = indexRegions.find(item => item.key === card.dataset.region);
        const dish = region?.dishes.find(item => item.id === card.dataset.dish);
        if (!region || !dish) throw new Error(`Resep "${card.dataset.dish}" tidak ditemukan.`);
        lastFocusedCard = card;
        openDishStory(region, dish);
      });
    });

    dishStoryClose.addEventListener('click', closeDishStory);
    dishStory.addEventListener('click', event => {
      if (event.target === dishStory) closeDishStory();
    });

    document.querySelector('.close-button').addEventListener('click', () => {
      if (embedded) {
        window.parent.postMessage({ type: 'close-home-panel' }, window.location.origin);
      } else {
        window.location.href = 'index.html';
      }
    });

    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !dishStory.hidden) {
        closeDishStory();
      } else if (embedded && event.key === 'Escape') {
        window.parent.postMessage({ type: 'close-home-panel' }, window.location.origin);
      }
    });
  </script>
  <script src="loading-screen.js"></script>
</body>
</html>
